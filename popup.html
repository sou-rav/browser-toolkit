<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><img src="icons/icon48.png" alt=""><span>Browser Toolkit</span></div>
    <button id="settings" class="icon-btn" title="Settings">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </header>

  <button id="rec" class="hero tool-rec">
    <span class="dot"><i></i></span>
    <span class="txt"><b id="recTitle">Record screen</b><small id="recSub">MP4 · tab, window or screen</small></span>
  </button>

  <div id="recLive" class="card live hide tool-rec">
    <div class="top"><span class="state"><i class="pulse"></i><span id="recState">Recording</span></span><b id="recTime" class="time">00:00</b></div>
    <div class="btns">
      <button id="recPause" class="pillbtn"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span>Pause</span></button>
      <button id="recStop" class="pillbtn stop"><svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="2"/></svg><span>Stop &amp; save</span></button>
    </div>
  </div>

  <div class="label tool-shot">Screenshot</div>
  <div class="tiles tool-shot">
    <button id="shotVisible" class="tile edge-off">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8V6a2 2 0 0 1 2-2h2M16 4h2a2 2 0 0 1 2 2v2M20 16v2a2 2 0 0 1-2 2h-2M8 20H6a2 2 0 0 1-2-2v-2"/><rect x="8" y="9" width="8" height="6" rx="1"/></svg>
      <span>Visible area</span>
    </button>
    <button id="shotFull" class="tile edge-off">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="3" width="12" height="18" rx="2"/><path d="M12 8v8M9.5 10.5L12 8l2.5 2.5M9.5 13.5L12 16l2.5-2.5"/></svg>
      <span>Full page</span>
    </button>
    <button id="snip" class="tile">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.5"/><circle cx="6" cy="18" r="2.5"/><path d="M8 7.5L20 18M8 16.5L20 6"/></svg>
      <span>Snipping Tool</span>
    </button>
  </div>
  <div class="delay edge-off tool-shot">
    <span>Delay</span>
    <div class="seg" id="delaySeg">
      <button data-v="0">Off</button><button data-v="3">3s</button><button data-v="5">5s</button>
    </div>
    <input type="hidden" id="shotDelay" value="0">
  </div>

  <div class="label tool-dl">Downloads</div>
  <div class="card list tool-dl">
    <label class="row">
      <span><b>Sort downloads</b><small id="routerInfo"></small></span>
      <input type="checkbox" id="routerOn" class="switch">
    </label>
    <button id="editRules" class="row link">
      <span>Edit folder rules</span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </button>
  </div>

  <div class="card list edge-off tool-menu" style="margin-top:12px">
    <label class="row">
      <span><b>Selection menu</b><small>on <span id="site"></span></small></span>
      <input type="checkbox" id="on" class="switch">
    </label>
  </div>

  <div id="toast"></div>
  <script src="rules.js"></script>
  <script src="popup.js"></script>
</body></html>
